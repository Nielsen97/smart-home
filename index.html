
<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Home Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        .section { margin-bottom: 30px; }
        h2 { color: #333; }
        .weather-data { font-size: 1.2em; }
    </style>
</head>
<body>
    <h1>Smart Home Dashboard</h1>

    <div class="section" id="weather">
        <h2>Vejr i Aalborg</h2>
        <div class="weather-data" id="weather-info">Henter vejrdata...</div>
    </div>

    <script>
        const apiKey = '253dc5ed14c6c7e291a79d0cb41b82fb'; // Erstat med din OpenWeatherMap API-nøgle
        const city = 'Aalborg';
        const url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&units=metric&lang=da&appid=${apiKey}`;

        fetch(url)
            .then(response => response.json())
            .then(data => {
                const temp = data.main.temp;
                const wind = data.wind.speed;
                const sunrise = new Date(data.sys.sunrise * 1000).toLocaleTimeString('da-DK');
                const sunset = new Date(data.sys.sunset * 1000).toLocaleTimeString('da-DK');

                document.getElementById('weather-info').innerHTML = `
                    Temperatur: ${temp} °C<br>
                    Vind: ${wind} m/s<br>
                    Solopgang: ${sunrise}<br>
                    Solnedgang: ${sunset}
                `;
            })
            .catch(error => {
                document.getElementById('weather-info').innerText = 'Kunne ikke hente vejrdata.';
                console.error('Fejl ved hentning af vejrdata:', error);
            });
    </script>
</body>
</html>
