<!DOCTYPE html>
<html lang='da'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Smart Home Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #333;
        }
        .section {
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 10px;
            border: none;
            border-radius: 5px;
            background-color: #007aff;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #005bb5;
        }
    </style>
</head>
<body>
    <h1>Smart Home Dashboard</h1>

    <div class='section'>
        <h2>🌦️ Vejrudsigt</h2>
        <p>Temperatur: -- °C</p>
        <p>Vind: -- m/s</p>
        <p>Solopgang: --</p>
        <p>Solnedgang: --</p>
    </div>

    <div class='section'>
        <h2>⚡ Strømpris & Forbrug</h2>
        <p>Dagens pris: -- kr/kWh</p>
        <p>Forbrug i dag: -- kWh</p>
        <p><strong>💡 AI-forslag:</strong> Start vask kl. --</p>
    </div>

    <div class='section'>
        <h2>🎵 Musikstyring</h2>
        <button onclick="alert('Spiller playliste...')">Spil playliste</button>
        <button onclick="alert('Skifter sang...')">Næste sang</button>
        <button onclick="alert('Skruer op...')">Volumen +</button>
    </div>

    <div class='section'>
        <h2>💡 Lysstyring</h2>
        <button onclick="window.location.href='shortcuts://run-shortcut?name=Tænd%20Stuelampe'">Tænd stuelampe</button>
        <button onclick="window.location.href='shortcuts://run-shortcut?name=Sluk%20Stuelampe'">Sluk stuelampe</button>
        <button onclick="window.location.href='shortcuts://run-shortcut?name=Lysstyrke%2050%'">Lysstyrke 50%</button>
    </div>
</body>
</html>
